apiVersion: v1
kind: Service
metadata:
  name: kepler
  namespace: kepler
  labels:
    helm.sh/chart: kepler-0.12.0
    app.kubernetes.io/name: kepler
    app.kubernetes.io/instance: kepler
    app.kubernetes.io/version: v0.12.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kepler
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 28282
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: kepler
    app.kubernetes.io/instance: kepler
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kepler
  namespace: kepler
  labels:
    helm.sh/chart: kepler-0.12.0
    app.kubernetes.io/name: kepler
    app.kubernetes.io/instance: kepler
    app.kubernetes.io/version: v0.12.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kepler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
      app.kubernetes.io/instance: kepler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kepler
        app.kubernetes.io/instance: kepler
      annotations:
        checksum/config: 96e15b5294fcd2b493b56ecc30448580567bb38d1c48c2df02daba5ddbc02f1c
    spec:
      serviceAccountName: kepler
      hostPID: true
      hostUsers: true
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      nodeSelector:
        testbed.lab/energy-sensor: present
      containers:
      - name: kepler
        image: quay.io/sustainable_computing_io/kepler:v0.12.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          runAsNonRoot: false
        command:
        - /usr/bin/kepler
        args:
        - --config.file=/etc/kepler/config.yaml
        - --kube.enable
        - --kube.node-name=$(NODE_NAME)
        ports:
        - name: http
          containerPort: 28282
          protocol: TCP
        volumeMounts:
        - name: sysfs
          mountPath: /host/sys
          readOnly: true
        - name: procfs
          mountPath: /host/proc
          readOnly: true
        - name: cfm
          mountPath: /etc/kepler
        livenessProbe:
          httpGet:
            path: /probe/livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 60
        readinessProbe:
          httpGet:
            path: /probe/readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_MIG_MONITOR_DEVICES
          value: all
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: sysfs
        hostPath:
          path: /sys
      - name: procfs
        hostPath:
          path: /proc
      - name: cfm
        configMap:
          name: kepler

    \    redfish:\n      configFile: /etc/kepler/redfish.yaml\n      enabled: false\n\
    \      nodeName: \"\"\nexporter:\n  prometheus:\n    debugCollectors:\n    - go\n\
    \    enabled: true\n  stdout:\n    enabled: false\nhost:\n  procfs: /host/proc\n\
    \  sysfs: /host/sys\nkube:\n  config: \"\"\n  enabled: true\n  nodeName: \"\"\n\
    \  podInformer:\n    mode: apiserver\n    pollInterval: 15s\nlog:\n  format: text\n\
    \  level: info\nmonitor:\n  interval: 5s\n  maxTerminated: 100\n  minTerminatedEnergyThreshold:\
    \ 10\n  staleness: 500ms\nrapl:\n  zones: []\nweb:\n  configFile: \"\"\n  listenAddresses:\n\
    \  - :28282\n"

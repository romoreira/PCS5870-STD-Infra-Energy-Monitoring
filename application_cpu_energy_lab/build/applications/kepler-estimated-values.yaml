fullnameOverride: kepler-estimated
image:
  repository: quay.io/sustainable_computing_io/kepler
  tag: release-0.8.0
  digest: sha256:1c822681f48d8c6f66a4613987007107322e5320f695c1cd284cef2d343bf24b
  pullPolicy: IfNotPresent
nodeSelector:
  kubernetes.io/hostname: vmteste
canMount:
  usrSrc: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
modelServer:
  enabled: false
extraEnvVars:
  KEPLER_LOG_LEVEL: '3'
  KEPLER_NAMESPACE: kepler-estimated
  ENABLE_GPU: 'false'
  ENABLE_QAT: 'false'
  ENABLE_MSR: 'false'
  ENABLE_API_SERVER: 'true'
  ENABLE_EBPF_CGROUPID: 'true'
  ENABLE_PROCESS_METRICS: 'false'
  EXPOSE_VM_METRICS: 'false'
  EXPOSE_CONTAINER_METRICS: 'true'
  EXPOSE_COMPONENT_POWER: 'true'
  EXPOSE_ESTIMATED_IDLE_POWER_METRICS: 'false'
  MODEL_SERVER_ENABLE: 'false'
  MODEL_CONFIG: 'NODE_COMPONENTS_LOCAL_REGRESSOR=true

    NODE_TOTAL_LOCAL_REGRESSOR=true

    PROCESS_COMPONENTS_ESTIMATOR=false

    PROCESS_TOTAL_ESTIMATOR=false

    '
  KUBERNETES_SERVICE_HOST: 10.30.6.94
  KUBERNETES_SERVICE_PORT: '6443'
  KUBERNETES_SERVICE_PORT_HTTPS: '6443'
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 5s
  scrapeTimeout: 4s
  labels:
    release: monitoring
  relabelings:
  - action: replace
    sourceLabels:
    - __meta_kubernetes_pod_node_name
    targetLabel: instance
  - action: replace
    targetLabel: job
    replacement: kepler-estimated

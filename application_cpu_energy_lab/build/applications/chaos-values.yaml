clusterScoped: false
controllerManager:
  replicaCount: 1
  targetNamespace: default
  serviceAccount: chaos-controller-manager
  enableFilterNamespace: true
  allowHostNetworkTesting: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
dnsServer:
  create: false
dashboard:
  create: true
  replicaCount: 1
  securityMode: true
  rootUrl: http://[2001:48d0:6031:1991:f816:3eff:fee2:e44a]:30001
  service:
    type: NodePort
    nodePort: 30001
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClassName: openebs-hostpath
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

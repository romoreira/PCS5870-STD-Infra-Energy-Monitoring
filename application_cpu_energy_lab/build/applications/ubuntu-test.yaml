apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-test
  namespace: cpu-lab
  labels:
    app: ubuntu-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu-test
  template:
    metadata:
      labels:
        app: ubuntu-test
        testbed.lab/workload: cpu
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: ubuntu-test
        image: docker.io/library/ubuntu:22.04
        command:
        - /bin/bash
        - -c
        - exec sleep infinity
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '4'
            memory: 1Gi

fullnameOverride: monitoring
alertmanager:
  enabled: false
defaultRules:
  create: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 2d
    retentionSize: 3GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-hostpath
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    additionalScrapeConfigs: []
grafana:
  fullnameOverride: grafana
  defaultDashboardsEnabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: openebs-hostpath
    size: 1Gi
  deploymentStrategy:
    type: Recreate
  service:
    type: NodePort
    nodePort: 30000
    ipFamilyPolicy: RequireDualStack
    ipFamilies:
    - IPv4
    - IPv6
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  grafana.ini:
    server:
      root_url: http://[2001:48d0:6031:1991:f816:3eff:fecd:5bec]:30000/
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: monitoring
    datasources:
      enabled: true
      uid: prometheus
      alertmanager:
        enabled: false
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

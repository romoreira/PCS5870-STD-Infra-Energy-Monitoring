apiVersion: v1
kind: ServiceAccount
metadata:
  name: kepler-estimated
  namespace: kepler-estimated
  labels:
    helm.sh/chart: kepler-0.6.2
    app.kubernetes.io/name: kepler
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: release-0.8.0
    app.kubernetes.io/managed-by: Helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kepler-estimated-clusterrole
rules:
- apiGroups:
  - ''
  resources:
  - nodes/metrics
  - nodes/proxy
  - nodes/stats
  - pods
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kepler-estimated-clusterrole-binding
roleRef:
  kind: ClusterRole
  name: kepler-estimated-clusterrole
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: kepler-estimated
  namespace: kepler-estimated
---
apiVersion: v1
kind: Service
metadata:
  name: kepler-estimated
  namespace: kepler-estimated
  labels:
    helm.sh/chart: kepler-0.6.2
    app.kubernetes.io/name: kepler
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: release-0.8.0
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9102
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: kepler
    app.kubernetes.io/component: exporter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kepler-estimated
  namespace: kepler-estimated
  labels:
    helm.sh/chart: kepler-0.6.2
    app.kubernetes.io/name: kepler
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: release-0.8.0
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kepler
        app.kubernetes.io/component: exporter
    spec:
      hostNetwork: true
      serviceAccountName: kepler-estimated
      containers:
      - name: kepler-exporter
        image: quay.io/sustainable_computing_io/kepler@sha256:1c822681f48d8c6f66a4613987007107322e5320f695c1cd284cef2d343bf24b
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        args:
        - -v=$(KEPLER_LOG_LEVEL)
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: METRIC_PATH
          value: /metrics
        - name: BIND_ADDRESS
          value: 0.0.0.0:9102
        - name: CGROUP_METRICS
          value: '*'
        - name: CPU_ARCH_OVERRIDE
          value: ''
        - name: ENABLE_API_SERVER
          value: 'true'
        - name: ENABLE_EBPF_CGROUPID
          value: 'true'
        - name: ENABLE_GPU
          value: 'false'
        - name: ENABLE_MSR
          value: 'false'
        - name: ENABLE_PROCESS_METRICS
          value: 'false'
        - name: ENABLE_QAT
          value: 'false'
        - name: EXPOSE_CGROUP_METRICS
          value: 'false'
        - name: EXPOSE_COMPONENT_POWER
          value: 'true'
        - name: EXPOSE_CONTAINER_METRICS
          value: 'true'
        - name: EXPOSE_ESTIMATED_IDLE_POWER_METRICS
          value: 'false'
        - name: EXPOSE_HW_COUNTER_METRICS
          value: 'true'
        - name: EXPOSE_IRQ_COUNTER_METRICS
          value: 'true'
        - name: EXPOSE_VM_METRICS
          value: 'false'
        - name: KEPLER_LOG_LEVEL
          value: '3'
        - name: KEPLER_NAMESPACE
          value: kepler-estimated
        - name: MODEL_CONFIG
          value: 'NODE_COMPONENTS_LOCAL_REGRESSOR=true

            NODE_TOTAL_LOCAL_REGRESSOR=true

            PROCESS_COMPONENTS_ESTIMATOR=false

            PROCESS_TOTAL_ESTIMATOR=false

            '
        - name: MODEL_SERVER_ENABLE
          value: 'false'
        - name: KUBERNETES_SERVICE_HOST
          value: 10.30.6.94
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: '6443'
        ports:
        - containerPort: 9102
          hostPort: 9102
          name: http
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 60
          successThreshold: 1
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 1
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
        - name: tracing
          mountPath: /sys
        - name: proc
          mountPath: /proc
        - name: config-dir
          mountPath: /etc/kepler
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: lib-modules
        hostPath:
          path: /lib/modules
          type: DirectoryOrCreate
      - name: tracing
        hostPath:
          path: /sys
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: config-dir
        emptyDir:
          sizeLimit: 100Ki
      nodeSelector:
        kubernetes.io/hostname: vmteste
        kubernetes.io/os: linux
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kepler-estimated-prometheus-exporter
  namespace: monitoring
  labels:
    helm.sh/chart: kepler-0.6.2
    app.kubernetes.io/name: kepler
    app.kubernetes.io/component: exporter
    app.kubernetes.io/version: release-0.8.0
    app.kubernetes.io/managed-by: Helm
    release: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  attachMetadata:
    node: false
  endpoints:
  - port: http
    interval: 5s
    scrapeTimeout: 4s
    path: /metrics
    scheme: http
    relabelings:
    - action: replace
      sourceLabels:
      - __meta_kubernetes_pod_node_name
      targetLabel: instance
    - action: replace
      replacement: kepler-estimated
      targetLabel: job
  namespaceSelector:
    matchNames:
    - kepler-estimated
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
      app.kubernetes.io/component: exporter

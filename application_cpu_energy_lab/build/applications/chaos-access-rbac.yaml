apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-lab-manager
  namespace: cpu-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-lab-manager
  namespace: cpu-lab
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - events
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - chaos-mesh.org
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-lab-manager
  namespace: cpu-lab
subjects:
- kind: ServiceAccount
  name: chaos-lab-manager
  namespace: cpu-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-lab-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpu-lab-chaos-namespace-reader
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cpu-lab-chaos-namespace-reader
subjects:
- kind: ServiceAccount
  name: chaos-lab-manager
  namespace: cpu-lab
- kind: ServiceAccount
  name: chaos-controller-manager
  namespace: chaos-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cpu-lab-chaos-namespace-reader
